name: Build and publish SBC5 RC channel

on:
  push:
    branches: [main]
    paths:
      - ".rc-source.json"
      - "scripts/**"
      - ".github/workflows/sync-rc.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: sbc5-rc-distribution
  cancel-in-progress: false

jobs:
  publish-rc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validators
        run: python -m pip install --disable-pip-version-check pyyaml jinja2
      - name: Resolve immutable RC source
        id: rc
        run: |
          python - <<'PY'
          import json,os,re
          data=json.load(open('.rc-source.json'))
          assert re.fullmatch(r'\d+\.\d+\.\d+-rc[1-9]\d*',data['version'])
          assert re.fullmatch(r'[0-9a-f]{40}',data['app_commit'])
          assert data['app_repository']=='krlmdfk/sbc5-control-center'
          assert data['app_branch'].startswith('rc/')
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              for key in ('version','app_repository','app_branch','app_commit'):
                  print(key+'='+data[key],file=out)
          PY
      - name: Reject version re-publishing
        id: released
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.rc.outputs.version }}
        run: |
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Fetch pinned tested source
        if: steps.released.outputs.exists != 'true'
        env:
          REPOSITORY: ${{ steps.rc.outputs.app_repository }}
          BRANCH: ${{ steps.rc.outputs.app_branch }}
          COMMIT: ${{ steps.rc.outputs.app_commit }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$BRANCH" "https://github.com/$REPOSITORY.git" _source
          test "$(git -C _source rev-parse HEAD)" = "$COMMIT"
      - name: Generate guarded RC App and HACS integration
        if: steps.released.outputs.exists != 'true'
        run: |
          set -euo pipefail
          python scripts/sync_rc.py
          python -m compileall -q scripts custom_components/sbc5_control_center sbc5_control_center_rc
          bash -n sbc5_control_center_rc/rc_exclusive_guard.sh
          python - <<'PY'
          from pathlib import Path
          import yaml,json
          app=Path('sbc5_control_center_rc')
          c=yaml.safe_load((app/'config.yaml').read_text())
          m=json.loads(Path('custom_components/sbc5_control_center/manifest.json').read_text())
          assert c['version']==m['version']=='3.2.1-rc1'
          assert c['slug']=='sbc5_control_center_rc'
          assert c['boot']=='manual' and c['stage']=='experimental'
          assert c['options']['rc_exclusive_ack'] is False
          assert c['schema']['rc_exclusive_ack']=='bool'
          assert 'ENTRYPOINT ["/rc_exclusive_guard.sh"]' in (app/'Dockerfile').read_text()
          assert 'watch_stable &' in (app/'rc_exclusive_guard.sh').read_text()
          print('RC metadata and startup exclusion: PASS')
          PY
      - name: Run release candidate security regressions
        if: steps.released.outputs.exists != 'true'
        run: |
          set -euo pipefail
          cd _source
          python scripts/test_ai_output_boundary_3_2_1.py
          python scripts/test_private_ai_training_telemetry_3_2_1.py
          python scripts/test_zip_security_preflight_3_2_1.py
          python scripts/test_config_ui_request_limits_3_2_1.py
          python scripts/test_migration_namespace_ownership_3_2_1.py
          python scripts/test_ai_v5_observability.py
          python scripts/validate_release.py --strict-manifest-hashes
      - name: Package RC fallback archives
        if: steps.released.outputs.exists != 'true'
        env:
          VERSION: ${{ steps.rc.outputs.version }}
        run: |
          mkdir -p dist
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile,ZIP_DEFLATED
          import os,hashlib
          version=os.environ['VERSION']
          for title,root in [('SBC5_RC_App',Path('sbc5_control_center_rc')),('SBC5_RC_HACS',Path('custom_components/sbc5_control_center'))]:
              dest=Path('dist')/(title+'_'+version+'.zip')
              with ZipFile(dest,'w',compression=ZIP_DEFLATED,compresslevel=9) as z:
                  for path in sorted(root.rglob('*')):
                      if path.is_file() and '__pycache__' not in path.parts and path.suffix!='.pyc':
                          z.write(path,path.as_posix())
              digest=hashlib.sha256(dest.read_bytes()).hexdigest()
              dest.with_suffix('.sha256').write_text(digest+'  '+dest.name+'\n')
          PY
      - name: Push generated RC App and HACS files
        if: steps.released.outputs.exists != 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A sbc5_control_center_rc custom_components
          # Imported upstream files are retained byte-identical for App/HACS parity.
          # Their pre-existing whitespace is not a reason to rewrite audited code.
          if ! git diff --cached --quiet; then
            git commit -m "Publish test channel ${{ steps.rc.outputs.version }}"
            git push origin HEAD:main
          fi
      - name: Publish prerelease, never latest
        if: steps.released.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.rc.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --target main \
            --title "SBC5 Control Center $VERSION - TEST ONLY" --prerelease --latest=false \
            --notes "Opt-in RC. Stop Stable SBC5, create backup, and enable rc_exclusive_ack only after confirming Stable is stopped. Manual boot, not stable." \
            dist/*.zip dist/*.sha256
